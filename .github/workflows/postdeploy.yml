name: Post-deploy check
# После пуша в main ждёт, пока сервер дома обновится (до 30 минут), и проверяет прод по публичным адресам.
# Красный прогон = выкатка не пришла, не прошла проверку на копии базы или прод стал хуже (GitHub пришлёт письмо).
# Токен дозора (только чтение сводки) — секрет WATCH_TOKEN репозитория: с ним проверяются ещё «Состояние», ошибки экранов и скорость.
on:
  push:
    branches: [main]
    paths: ['backend/**', 'frontend/**', 'deploy/**', 'Dockerfile', 'docker-compose.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postdeploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: ./deploy/postcheck.sh "${GITHUB_SHA}" 30
        env:
          WATCH_TOKEN: ${{ secrets.WATCH_TOKEN }}
          HH_QUIET: '1'   # журнал публичный — без текстов проблем
