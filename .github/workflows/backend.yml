name: Тесты
on:
  push:
    branches: [main]
    paths: ['backend/**', 'frontend/**', 'alice/**', 'deploy/**', 'Dockerfile', '.dockerignore', 'docker-compose.yml', 'android/version.properties', '.github/workflows/backend.yml']
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: backend/requirements.txt}
      - run: pip install -r backend/requirements.txt pytest radicale playwright
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: cd frontend && npm ci && npm run build
      - run: playwright install --with-deps chromium
      # backend/tests включает сквозные тесты в браузере (test_e2e.py) и проверку на настоящем CalDAV (Radicale)
      - run: cd backend && python -m pytest -q
      - run: python -m pytest -q alice/test_handler.py
      - run: bash deploy/test-rollback.sh

  # Тот же образ, что собирает сервер дома (deploy/update.sh): если он не собирается или не стартует,
  # дом молча откатывается на старую версию — ловим это здесь, до прода.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg GIT_SHA=ci -t homehub-calendar:ci .
      - name: Сервер стартует и отвечает
        run: |
          mkdir -p ci-config ci-data
          printf 'timezone: Asia/Yekaterinburg\nsources: []\n' > ci-config/config.yaml
          docker run -d --name hh -p 18080:8080 -v "$PWD/ci-config:/config:ro" -v "$PWD/ci-data:/data" homehub-calendar:ci
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:18080/api/health && curl -fsS http://127.0.0.1:18080/api/ready; then exit 0; fi
            sleep 2
          done
          docker logs hh; exit 1
