name: Тесты
on:
  push:
    branches: [main]
    paths: ['backend/**', 'frontend/**', 'alice/**', '.github/workflows/backend.yml']
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: backend/requirements.txt}
      - run: pip install -r backend/requirements.txt pytest radicale
      - run: cd backend && python -m pytest -q
      - run: python -m pytest -q alice/test_handler.py
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: cd frontend && npm ci && npm run build
