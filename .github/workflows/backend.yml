name: Тесты
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.12', cache: pip, cache-dependency-path: backend/requirements.lock}
      - run: |
          pip install --require-hashes -r backend/requirements.lock
          sed -nE 's/^(.*==[^[:space:]]+).*/\1/p' backend/requirements.lock > "$RUNNER_TEMP/runtime-constraints.txt"
          pip install -c "$RUNNER_TEMP/runtime-constraints.txt" pytest==9.2.0 radicale==3.9.2 playwright==1.65.2
          pip check
      - uses: actions/setup-node@v7
        with: {node-version: 22.16.0, cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: cd frontend && npm ci && npm run lint && npm test && npm run build
      - run: playwright install --with-deps chromium
      # backend/tests включает сквозные тесты в браузере (test_e2e.py) и проверку на настоящем CalDAV (Radicale)
      - run: cd backend && python -m pytest -q
      - run: python -m pytest -q alice/test_handler.py
      - run: bash deploy/test-rollback.sh

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          docker build --build-arg "GIT_SHA=${GITHUB_SHA:0:7}" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "homehub-calendar:$GITHUB_SHA" .
      - name: Сервер стартует и отвечает
        run: |
          mkdir -p ci-config ci-data
          printf 'timezone: Asia/Yekaterinburg\nsources: []\n' > ci-config/config.yaml
          docker run -d --name hh -p 18080:8080 -v "$PWD/ci-config:/config:ro" -v "$PWD/ci-data:/data" "homehub-calendar:$GITHUB_SHA"
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:18080/api/health | grep -F "+${GITHUB_SHA:0:7}" && curl -fsS http://127.0.0.1:18080/api/ready; then exit 0; fi
            sleep 2
          done
          docker logs hh; exit 1
      - name: Подготовить проверенный образ Proxmox
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -o pipefail
          docker save "homehub-calendar:$GITHUB_SHA" | gzip -1 > homehub-calendar.tar.gz
          sha256sum homehub-calendar.tar.gz | cut -d ' ' -f 1 > homehub-calendar.tar.gz.sha256
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: server-image
          path: homehub-calendar.tar.gz*
          compression-level: 0
          retention-days: 3

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: server-image
      - name: Опубликовать образ Proxmox
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="server-$GITHUB_SHA"
          if gh release view "$tag" >/dev/null 2>&1; then
            exit 0
          fi
          gh release create "$tag" homehub-calendar.tar.gz homehub-calendar.tar.gz.sha256 \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "Сервер ${GITHUB_SHA:0:7}" \
            --notes "Контейнер HomeHubCalendar для автоматического обновления Proxmox."
