name: iOS app
on:
  push:
    branches: [main]
    paths: ['ios/**', '!ios/release/**', 'macos/Sources/**', '.github/workflows/ios.yml']
  # Pull request: собрать до слияния (правки Swift идут в main только через PR — deploy/check.sh); публикация из main готовит отдельную ветку сборки.
  pull_request:
    paths: ['ios/**', '!ios/release/**', 'macos/Sources/**', '.github/workflows/ios.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: XcodeGen
        run: brew install xcodegen
      - name: Сборка без подписи (AltStore подпишет Apple ID на самом телефоне)
        run: |
          VER=$(cat ios/version.txt)
          cd ios
          xcodegen generate
          xcodebuild -project HomeHubCalendar.xcodeproj -scheme HomeHubCalendar -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            MARKETING_VERSION="$VER" CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          rm -rf Payload && mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/HomeHubCalendar.app Payload/
          zip -qry HomeHub-Calendar.ipa Payload
          ls -la HomeHub-Calendar.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: HomeHub-Calendar-ios
          path: ios/HomeHub-Calendar.ipa

  publish:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: HomeHub-Calendar-ios
          path: ios/release
      - name: Подготовить ветку сборки для pull request
        run: |
          branch="release/ios-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf '{"version": "%s", "build": %s, "date": "%s"}\n' "$(cat ios/version.txt)" "$GITHUB_RUN_NUMBER" "$(date -u +%Y-%m-%d)" > ios/release/version.json
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add ios/release/HomeHub-Calendar.ipa ios/release/version.json
          git commit -m "ios: сборка ${GITHUB_RUN_NUMBER}"
          git push origin "HEAD:refs/heads/$branch"
          printf '[Открыть pull request со сборкой](%s/%s/compare/main...%s?expand=1)\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$branch" >> "$GITHUB_STEP_SUMMARY"
