name: macOS app
on:
  push:
    branches: [main]
    paths: ['macos/**', '!macos/release/**', '.github/workflows/macos.yml']
  # Pull request: собрать до слияния (правки Swift идут в main только через PR — deploy/check.sh); публикация из main готовит отдельную ветку сборки.
  pull_request:
    paths: ['macos/**', '!macos/release/**', '.github/workflows/macos.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Версии
        run: swift --version && xcodebuild -version
      - name: Тесты
        run: cd macos && swift test
      - name: Сборка приложения
        run: macos/build-app.sh
      - uses: actions/upload-artifact@v7
        with:
          name: HomeHub-Calendar-mac
          path: macos/build/HomeHub-Calendar.zip

  publish:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: HomeHub-Calendar-mac
          path: macos/release
      - name: Подготовить ветку сборки для pull request
        run: |
          branch="release/macos-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf '{"version": "%s", "build": %s}\n' "$(cat macos/version.txt)" "$GITHUB_RUN_NUMBER" > macos/release/version.json
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add macos/release/HomeHub-Calendar.zip macos/release/version.json
          git commit -m "macos: сборка ${GITHUB_RUN_NUMBER}"
          git push origin "HEAD:refs/heads/$branch"
          printf '[Открыть pull request со сборкой](%s/%s/compare/main...%s?expand=1)\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$branch" >> "$GITHUB_STEP_SUMMARY"

  # Снимки экрана виджета (светлая/тёмная тема, все размеры) — смотреть в артефакте «widget-snapshots».
  # Отдельная задача: сбой здесь не мешает выпуску приложения.
  widget-snapshots:
    runs-on: macos-15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: Нарисовать виджет
        run: |
          cd macos
          # Тест подключаем только здесь, чтобы он не попадал в обычную сборку и тесты выпуска.
          mkdir -p Tests/WidgetSnapshotTests && cp snapshot-tests/*.swift Tests/WidgetSnapshotTests/
          python3 - <<'PY'
          p = open("Package.swift").read()
          key = '.testTarget(name: "HomeHubCoreTests", dependencies: ["HomeHubCore"], exclude: ["Fixtures"]),'
          p = p.replace(key, key + '\n        .testTarget(name: "WidgetSnapshotTests", dependencies: ["HomeHubMac", "HomeHubCore"]),')
          open("Package.swift", "w").write(p)
          PY
          WIDGET_SNAP_DIR="$PWD/widget-snapshots" swift test --filter WidgetSnapshotTests
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: widget-snapshots
          path: macos/widget-snapshots/*.png
          if-no-files-found: warn
